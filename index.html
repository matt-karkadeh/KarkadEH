<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBEEDE">
  <meta name="description" content="KarkadEH — hibiscus, differently. A small-batch specialty food brand coming to Ontario.">
  <title>KarkadEH | Hibiscus, differently.</title>
  <style>
    :root { color-scheme: light; --cream:#FBEEDE; --burgundy:#430000; --red:#C60623; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--cream); }
    body { margin:0; min-height:100vh; font-family:Georgia, "Times New Roman", serif; color:var(--burgundy); background:var(--cream); }
    main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:clamp(32px,7vw,72px) 24px; }
    .logo { display:block; width:min(100%, 680px); height:auto; }
    h1 { font-size:clamp(24px,4vw,38px); font-weight:normal; letter-spacing:.025em; margin:8px 0 18px; }
    .rule { width:48px; height:1px; background:var(--red); margin:12px auto 28px; }
    p { max-width:490px; font-size:clamp(16px,2.4vw,19px); line-height:1.65; margin:0 0 24px; }
    .coming { font: 600 11px/1.5 Arial,sans-serif; letter-spacing:.22em; text-transform:uppercase; color:var(--red); margin-bottom:18px; }
    a { color:var(--burgundy); text-underline-offset:4px; }
    footer { font: 12px/1.5 Arial,sans-serif; margin-top:40px; opacity:.75; }
    @media(max-width:540px){.logo{width:min(100%,480px)} main{justify-content:center} }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="karkadeh-logo.png" alt="KarkadEH" width="2200" height="1400">
    <h1>Hibiscus, differently.</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Exploring hibiscus beyond the teacup through distinctive flavours and small-batch specialty foods.</p>
    <div class="coming">Launching in Ontario</div>
    <p>For inquiries: <a href="mailto:info@karkadeh.ca">info@karkadeh.ca</a></p>
    <footer>© 2026 KarkadEH</footer>
  </main>
</body>
</html>
