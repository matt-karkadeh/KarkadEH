<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarkadEH | Hibiscus, differently.</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f0e5;
  color: #29201d;
}

main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 45px 24px;
}

.wrap {
  width: 100%;
  max-width: 760px;
  text-align: center;
}

.flower {
  font-size: 54px;
  color: #8b1735;
  margin-bottom: 14px;
}

h1 {
  margin: 0;
  color: #8b1735;
  font-size: clamp(52px, 12vw, 92px);
  line-height: .95;
  letter-spacing: -4px;
}

.tagline {
  margin: 22px 0 34px;
  font-size: clamp(23px, 5vw, 34px);
  font-weight: 600;
}

.rule {
  width: 70px;
  height: 4px;
  margin: 0 auto 34px;
  background: #8b1735;
}

p {
  margin: 0 auto 22px;
  max-width: 650px;
  font-size: 18px;
  line-height: 1.65;
}

.names {
  color: #8b1735;
  font-weight: 700;
}

.launch {
  margin-top: 38px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.contact {
  display: inline-block;
  margin-top: 16px;
  color: #8b1735;
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
}

.contact:hover {
  text-decoration: underline;
}
</style>
</head>

<body>
<main>
  <div class="wrap">
    <div class="flower">✦</div>

    <h1>KarkadEH</h1>
    <div class="tagline">Hibiscus, differently.</div>

    <div class="rule"></div>

    <p>
      A Canadian food brand built around one remarkable flower.
    </p>

    <p>
      Tart, vibrant and enjoyed around the world as
      <span class="names">karkadeh, flor de jamaica, sorrel and bissap.</span>
      We're exploring new ways to bring hibiscus to the table.
    </p>

    <div class="launch">Launching in Ontario</div>

    <a class="contact" href="mailto:mkelly@karkadeh.ca">
      mkelly@karkadeh.ca
    </a>
  </div>
</main>
</body>
</html>
